name: UI Automated Tests

on:
  push:
    branches: [main, feature/selenium-base-framework]
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Construir backend
      - name: Build backend
        run: |
          cd backend
          docker build -t backend-tests .

      # Construir frontend
      - name: Build frontend
        run: |
          cd frontend
          docker build -t frontend-app .

      # Levantar backend en segundo plano
      - name: Run backend container
        run: |
          docker run -d --name backend-container -p 3000:3000 backend-tests

      # Levantar frontend en segundo plano
      - name: Run frontend container
        run: |
          docker run -d --name frontend-container -p 8080:80 frontend-app

      # Ejecutar pruebas Selenium
      - name: Run Selenium tests
        run: |
          # Levantar un contenedor temporal para correr los tests
          docker run --rm --network host -v ${{ github.workspace }}/frontend/tests:/tests frontend-app \
          bash -c "pip install -r /tests/requirements.txt && python3 -m unittest discover -s /tests"

      # Limpiar contenedores
      - name: Stop containers
        run: |
          docker stop backend-container frontend-container
